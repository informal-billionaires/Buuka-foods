<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#19211f" flood-opacity=".08"/></filter>
    <style>
      .font { font-family: Inter, Arial, sans-serif; fill: #17231f; }
      .muted { fill: #71807a; } .line { stroke: #dce5e0; stroke-width: 1; }
      .label { font-family: Inter, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #1b4d3e; }
      .small { font-family: Inter, Arial, sans-serif; font-size: 13px; fill: #71807a; }
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#f7f8f6"/>
  <!-- Product canvas -->
  <rect x="54" y="48" width="1135" height="904" rx="26" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="54" y="48" width="1135" height="78" rx="26" fill="#ffffff"/>
  <line x1="54" y1="126" x2="1189" y2="126" class="line"/>
  <!-- Nav -->
  <circle cx="105" cy="87" r="22" fill="#ff7900"/><text x="105" y="94" text-anchor="middle" class="font" font-size="20" font-weight="800" fill="#fff">B</text>
  <text x="139" y="83" class="font" font-size="18" font-weight="800">Bukka Foods</text><text x="139" y="103" class="font muted" font-size="11">Real Nigerian food, delivered fast.</text>
  <text x="615" y="92" class="font" font-size="14">Browse</text><text x="686" y="92" class="font" font-size="14" font-weight="800" fill="#e76600">Orders</text><text x="755" y="92" class="font" font-size="14">Become a vendor</text>
  <rect x="928" y="69" width="128" height="38" rx="19" fill="#f1f4f1"/><text x="992" y="93" text-anchor="middle" class="font" font-size="13" font-weight="700">⌖  Lagos, NG</text>
  <circle cx="1126" cy="87" r="20" fill="#153f32"/><text x="1126" y="92" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#fff">LO</text>
  <!-- Main -->
  <text x="110" y="188" class="font" font-size="30" font-weight="800">Your orders</text>
  <text x="110" y="215" class="font muted" font-size="15">Track your food, reorder favourites, and get help in seconds.</text>
  <!-- Action toolbar -->
  <rect x="110" y="249" width="720" height="48" rx="12" fill="#f5f7f5"/>
  <text x="132" y="279" class="font muted" font-size="16">⌕</text><text x="159" y="279" class="font muted" font-size="14">Search restaurant, dish or order ID</text>
  <rect x="844" y="249" width="110" height="48" rx="12" fill="#f5f7f5"/><text x="899" y="279" text-anchor="middle" class="font" font-size="13" font-weight="700">⌄  Filter</text>
  <rect x="967" y="249" width="126" height="48" rx="12" fill="#153f32"/><text x="1030" y="279" text-anchor="middle" font-family="Inter,Arial" font-size="13" font-weight="700" fill="#fff">Order again</text>
  <!-- Tabs -->
  <text x="112" y="343" class="font" font-size="14" font-weight="800" fill="#e76600">All orders</text><text x="220" y="343" class="font muted" font-size="14">Active</text><text x="300" y="343" class="font muted" font-size="14">Past orders</text>
  <rect x="110" y="358" width="79" height="3" rx="2" fill="#ff7900"/><line x1="110" y1="360" x2="1093" y2="360" class="line"/>
  <!-- active tracking card -->
  <rect x="110" y="388" width="983" height="196" rx="18" fill="#f4fbf7" stroke="#b9e2ca" stroke-width="1.5"/>
  <rect x="135" y="414" width="116" height="116" rx="13" fill="#f6d1aa"/><circle cx="193" cy="472" r="35" fill="#ee8f36"/><path d="M167 470h53l-6 17h-41z" fill="#fff0db"/><path d="M174 461h39l-5-10h-29z" fill="#6b391f"/>
  <rect x="272" y="415" width="85" height="25" rx="13" fill="#ddf4e5"/><text x="315" y="432" text-anchor="middle" class="font" font-size="11" font-weight="800" fill="#167447">ON THE WAY</text>
  <text x="272" y="465" class="font" font-size="20" font-weight="800">Bukkaafood</text><text x="272" y="489" class="font muted" font-size="14">Jollof rice + 2 items  ·  ₦4,200</text>
  <text x="272" y="518" class="font" font-size="13" font-weight="700">Arriving in 12–18 min</text>
  <circle cx="566" cy="515" r="7" fill="#2b9c61"/><line x1="573" y1="515" x2="665" y2="515" stroke="#2b9c61" stroke-width="4"/><circle cx="671" cy="515" r="7" fill="#2b9c61"/><line x1="678" y1="515" x2="770" y2="515" stroke="#bcd8c7" stroke-width="4"/><circle cx="777" cy="515" r="7" fill="#bcd8c7"/>
  <text x="557" y="545" class="font muted" font-size="11">Cooking</text><text x="655" y="545" class="font muted" font-size="11">Rider picked up</text><text x="754" y="545" class="font muted" font-size="11">Delivered</text>
  <rect x="916" y="466" width="151" height="45" rx="12" fill="#153f32"/><text x="992" y="494" text-anchor="middle" font-family="Inter,Arial" font-size="13" font-weight="700" fill="#fff">Track order  →</text>
  <!-- Past cards -->
  <text x="110" y="641" class="font" font-size="19" font-weight="800">Past orders</text>
  <g filter="url(#shadow)"><rect x="110" y="666" width="483" height="212" rx="17" fill="#fff"/><rect x="619" y="666" width="474" height="212" rx="17" fill="#fff"/></g>
  <rect x="132" y="688" width="82" height="82" rx="12" fill="#ffd9a4"/><circle cx="173" cy="729" r="23" fill="#eb6c2d"/><path d="M152 735h42l-5 12h-32z" fill="#fff"/>
  <text x="232" y="708" class="font muted" font-size="12">13 Aug 2026 · 2:51 PM</text><text x="232" y="737" class="font" font-size="18" font-weight="800">Bukkaafood</text><text x="232" y="759" class="font muted" font-size="13">Egusi soup + 1 item</text><text x="532" y="737" text-anchor="end" class="font" font-size="16" font-weight="800">₦3,600</text>
  <line x1="132" y1="794" x2="571" y2="794" class="line"/><text x="132" y="830" class="font muted" font-size="13">Delivered</text><rect x="430" y="808" width="140" height="42" rx="11" fill="#fff1e2"/><text x="500" y="834" text-anchor="middle" class="font" font-size="13" font-weight="800" fill="#db6400">Reorder  ↗</text>
  <rect x="641" y="688" width="82" height="82" rx="12" fill="#d4ebdb"/><circle cx="682" cy="729" r="25" fill="#77ab63"/><path d="M661 738h42l-6 9h-30z" fill="#fff"/>
  <text x="741" y="708" class="font muted" font-size="12">13 Aug 2026 · 3:14 PM</text><text x="741" y="737" class="font" font-size="18" font-weight="800">Eguisi Kitchen</text><text x="741" y="759" class="font muted" font-size="13">Pounded yam · vegetable soup</text><text x="1067" y="737" text-anchor="end" class="font" font-size="16" font-weight="800">₦2,900</text>
  <line x1="641" y1="794" x2="1071" y2="794" class="line"/><text x="641" y="830" class="font muted" font-size="13">Delivered</text><rect x="930" y="808" width="141" height="42" rx="11" fill="#fff1e2"/><text x="1000" y="834" text-anchor="middle" class="font" font-size="13" font-weight="800" fill="#db6400">Reorder  ↗</text>
  <!-- Side feature rail -->
  <text x="1234" y="91" class="font" font-size="21" font-weight="800">What’s new</text><text x="1234" y="116" class="font muted" font-size="13">Feature callouts</text>
  <line x1="1224" y1="154" x2="1224" y2="864" stroke="#d6dfda" stroke-width="2"/>
  <g><circle cx="1224" cy="190" r="13" fill="#ff7900"/><text x="1224" y="195" text-anchor="middle" font-family="Arial" font-size="12" font-weight="800" fill="#fff">1</text><text x="1251" y="184" class="label">Live order tracking</text><text x="1251" y="205" class="small">A clear delivery timeline and ETA<br/>bring the active order to the top.</text></g>
  <g><circle cx="1224" cy="350" r="13" fill="#ff7900"/><text x="1224" y="355" text-anchor="middle" font-family="Arial" font-size="12" font-weight="800" fill="#fff">2</text><text x="1251" y="344" class="label">Search + filters</text><text x="1251" y="365" class="small">Find any order quickly by restaurant,<br/>dish or ID; filter the order history.</text></g>
  <g><circle cx="1224" cy="510" r="13" fill="#ff7900"/><text x="1224" y="515" text-anchor="middle" font-family="Arial" font-size="12" font-weight="800" fill="#fff">3</text><text x="1251" y="504" class="label">Visual order cards</text><text x="1251" y="525" class="small">Restaurant thumbnails make repeat<br/>purchases easier to scan.</text></g>
  <g><circle cx="1224" cy="670" r="13" fill="#ff7900"/><text x="1224" y="675" text-anchor="middle" font-family="Arial" font-size="12" font-weight="800" fill="#fff">4</text><text x="1251" y="664" class="label">One-tap reorder</text><text x="1251" y="685" class="small">A consistent, high-visibility action<br/>turns order history into retention.</text></g>
  <g><circle cx="1224" cy="820" r="13" fill="#ff7900"/><text x="1224" y="825" text-anchor="middle" font-family="Arial" font-size="12" font-weight="800" fill="#fff">5</text><text x="1251" y="814" class="label">Saved address</text><text x="1251" y="835" class="small">Address context stays available in<br/>the header without extra friction.</text></g>
  <!-- connector lines -->
  <path d="M1093 486H1170V190H1210" fill="none" stroke="#ff7900" stroke-width="1.5" stroke-dasharray="4 5"/><path d="M1093 273H1158V350H1210" fill="none" stroke="#ff7900" stroke-width="1.5" stroke-dasharray="4 5"/><path d="M594 740H1168V510H1210" fill="none" stroke="#ff7900" stroke-width="1.5" stroke-dasharray="4 5"/>
</svg>
